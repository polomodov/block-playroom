name: Проверка

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты
        run: node --test tests/*.test.mjs
      - name: Перечень офлайн-файлов совпадает с кодом
        run: node scripts/update-offline.mjs --check
      - name: Встроенные аркады совпадают с закреплёнными коммитами
        run: node scripts/sync-games.mjs --check
