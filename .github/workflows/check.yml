name: Проверка

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Тесты
        run: node --test --experimental-test-coverage --test-coverage-exclude='**/tests/**' tests/*.test.mjs
      - name: Перечень офлайн-файлов совпадает с кодом
        run: node scripts/update-offline.mjs --check
      - name: Встроенные аркады совпадают с закреплёнными коммитами
        run: node scripts/sync-games.mjs --check

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run install-browsers
      - run: npm test
      - name: Трассировки упавших браузерных тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/browser/test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 5
